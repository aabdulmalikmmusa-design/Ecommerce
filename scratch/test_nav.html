<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel-Perfect Mobile Bottom Nav & Floating Search</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --mobile-nav-accent: #ff3b30;
      --mobile-nav-glow: rgba(255, 59, 48, 0.7);
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 24px 16px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Reference Screenshot Light Canvas */
    body.theme-light {
      background: linear-gradient(180deg, #edeff5 0%, #e1e3eb 100%);
      color: #1a1a1a;
    }

    /* Dark Mode Canvas */
    body.theme-dark {
      background: radial-gradient(circle at 50% 20%, #15171e 0%, #0a0b0d 100%);
      color: #ffffff;
    }

    /* Floating Quick Search Bar Capsule */
    #mobile-floating-search-bar {
      width: 100%;
      max-width: 340px;
      margin-bottom: 14px;
      transition: opacity 0.28s cubic-bezier(0.22, 1, 0.36, 1), transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #mobile-floating-search-bar.is-hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px) scale(0.96);
    }

    .search-capsule-inner {
      display: flex;
      align-items: center;
      background: #121316;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      padding: 10px 18px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.6), 0 2px 10px rgba(0, 0, 0, 0.4);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .search-capsule-inner:focus-within {
      border-color: var(--mobile-nav-accent);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.7), 0 0 18px var(--mobile-nav-glow);
    }

    /* Floating Bottom Navigation Bar Capsule */
    #mobile-bottom-nav {
      position: relative;
      width: 100%;
      max-width: 380px;
      height: 58px;
      background-color: #121316;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.65), 0 3px 12px rgba(0, 0, 0, 0.45);
      padding: 0 4px;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      --active-tab: 1; /* Default on Search tab to match reference screenshot */
    }

    /* Ambient Wave Glow Engine */
    #mobile-bottom-nav .nav-wave-track {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Continuous Unbroken Neon Red Baseline */
    #mobile-bottom-nav .nav-baseline {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2.5px;
      background-color: var(--mobile-nav-accent);
      opacity: 1;
      box-shadow: 0 0 6px var(--mobile-nav-accent), 0 0 14px var(--mobile-nav-glow);
      pointer-events: none;
    }

    /* Sliding Bell Curve Wave */
    #mobile-bottom-nav .nav-wave-slider {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 20%;
      transform: translateX(calc(var(--active-tab, 0) * 100%));
      transition: transform 0.38s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
      pointer-events: none;
    }

    #mobile-bottom-nav .nav-wave-stroke {
      filter: drop-shadow(0 0 4px var(--mobile-nav-accent)) drop-shadow(0 0 10px var(--mobile-nav-glow));
    }

    #mobile-bottom-nav .nav-wave-dot {
      filter: drop-shadow(0 0 4px var(--mobile-nav-accent)) drop-shadow(0 0 8px var(--mobile-nav-glow));
    }

    /* Nav Item Grid & Buttons */
    #mobile-bottom-nav .mobile-nav-grid {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      height: 100%;
      align-items: center;
      text-align: center;
    }

    #mobile-bottom-nav .mobile-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
      padding-bottom: 7px;
      text-decoration: none;
      background: transparent;
      border: none;
      cursor: pointer;
      outline: none;
      color: #949aa8;
      transition: color 0.25s ease;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }

    #mobile-bottom-nav .mobile-nav-item:active {
      transform: scale(0.92);
    }

    #mobile-bottom-nav .mobile-nav-item .nav-icon-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      height: 22px;
      margin-bottom: 3px;
      transition: opacity 0.22s ease, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    #mobile-bottom-nav .mobile-nav-item svg {
      width: 19px;
      height: 19px;
      stroke: #ffffff;
      stroke-width: 1.8;
    }

    #mobile-bottom-nav .mobile-nav-label {
      color: #8f95a3;
      font-size: 10px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.01em;
      transition: color 0.2s ease, font-weight 0.2s ease, text-shadow 0.2s ease;
    }

    /* Inactive Base Page Indicator: Label is Accent Red ("Home" in reference) */
    #mobile-bottom-nav .mobile-nav-item.is-current-page:not(.active):not(:hover) .mobile-nav-label {
      color: var(--mobile-nav-accent) !important;
      font-weight: 600;
    }

    /* Active or Hovered State inside glowing dome: Icon transforms into glowing center dot */
    #mobile-bottom-nav .mobile-nav-item.active .nav-icon-wrap,
    #mobile-bottom-nav .mobile-nav-item:hover .nav-icon-wrap {
      opacity: 0;
      transform: translateY(-8px) scale(0.3);
      pointer-events: none;
    }

    #mobile-bottom-nav .mobile-nav-item.active .mobile-nav-label,
    #mobile-bottom-nav .mobile-nav-item:hover .mobile-nav-label {
      color: #ffffff;
      font-weight: 600;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }

    /* Red Notification Badge Dot (e.g. Inbox / Cart) */
    .nav-badge-dot {
      position: absolute;
      top: -1px;
      right: -3px;
      width: 6px;
      height: 6px;
      background-color: var(--mobile-nav-accent);
      border-radius: 9999px;
      box-shadow: 0 0 6px var(--mobile-nav-accent);
    }

    .nav-badge-counter {
      position: absolute;
      top: -5px;
      right: -8px;
      min-width: 15px;
      height: 15px;
      padding: 0 3px;
      background-color: var(--mobile-nav-accent);
      color: #ffffff;
      font-size: 9px;
      font-weight: 700;
      border-radius: 9999px;
      border: 1.5px solid #121316;
      box-shadow: 0 0 6px var(--mobile-nav-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
  </style>
</head>
<body class="theme-light">

  <!-- Interactive Controls Bar -->
  <div class="w-full max-w-sm mb-8 flex flex-col items-center gap-3">
    <div class="flex items-center gap-2 bg-white/70 dark:bg-black/40 backdrop-blur-md p-1.5 rounded-full border border-black/10 dark:border-white/10 shadow-sm text-xs font-semibold">
      <button id="toggle-theme-btn" onclick="toggleTheme()" class="px-3 py-1 rounded-full bg-black text-white hover:bg-neutral-800 transition-colors">
        Toggle Canvas Background
      </button>
      <button id="toggle-tabset-btn" onclick="toggleTabSet()" class="px-3 py-1 rounded-full bg-neutral-200 dark:bg-neutral-800 text-neutral-800 dark:text-neutral-200 hover:bg-neutral-300 transition-colors">
        Mode: Reference (Image)
      </button>
    </div>
    <div class="text-[11px] text-gray-500 font-medium text-center">
      Hover or tap any tab below to test the fluid bell-curve gliding wave!
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- FLOATING QUICK SEARCH BAR CAPSULE (Directly above nav bar)   -->
  <!-- ============================================================ -->
  <div id="mobile-floating-search-bar">
    <div class="search-capsule-inner">
      <button type="button" aria-label="Search" class="text-[var(--mobile-nav-accent)] mr-3 flex-shrink-0 transition-transform active:scale-90">
        <svg class="w-5 h-5 drop-shadow-[0_0_6px_var(--mobile-nav-glow)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7.5"></circle>
          <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
        </svg>
      </button>
      <input 
        type="text" 
        id="quick-search-input" 
        placeholder="" 
        autocomplete="off"
        class="w-full bg-transparent text-sm text-white placeholder-gray-400 focus:outline-none"
        autofocus
      />
      <button type="button" onclick="closeSearch()" aria-label="Close search" class="text-gray-400 hover:text-white ml-2 p-1 transition-colors">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- FLOATING BOTTOM NAVIGATION BAR CAPSULE                       -->
  <!-- ============================================================ -->
  <nav id="mobile-bottom-nav" style="--active-tab: 1;">
    <!-- Ambient Wave Glow Engine Background -->
    <div class="nav-wave-track" aria-hidden="true">
      <div class="nav-baseline"></div>
      <div class="nav-wave-slider">
        <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 100 56" preserveAspectRatio="none">
          <defs>
            <radialGradient id="nav-arch-glow" cx="50%" cy="40%" r="55%">
              <stop offset="0%" stop-color="var(--mobile-nav-accent, #ff3b30)" stop-opacity="0.45"/>
              <stop offset="65%" stop-color="var(--mobile-nav-accent, #ff3b30)" stop-opacity="0.15"/>
              <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <!-- Dark background mask matching pill -->
          <path d="M 0,54.5 C 22,54.5 34,8.5 50,8.5 C 66,8.5 78,54.5 100,54.5 L 100,58 L 0,58 Z" fill="#121316"/>
          <!-- Soft radial crimson glow -->
          <ellipse cx="50" cy="29" rx="30" ry="20" fill="url(#nav-arch-glow)"/>
          <!-- Neon red glowing bell curve -->
          <path d="M 0,54.5 C 22,54.5 34,8.5 50,8.5 C 66,8.5 78,54.5 100,54.5" fill="none" stroke="var(--mobile-nav-accent, #ff3b30)" stroke-width="2.6" stroke-linecap="round" class="nav-wave-stroke"/>
          <!-- Center indicator dot inside the dome -->
          <circle cx="50" cy="27.5" r="2.4" fill="var(--mobile-nav-accent, #ff3b30)" class="nav-wave-dot"/>
        </svg>
      </div>
    </div>

    <!-- 5 Nav Tab Items Grid -->
    <div id="nav-items-container" class="mobile-nav-grid">
      <!-- Injected via JavaScript based on mode (Reference vs Store) -->
    </div>
  </nav>

  <script>
    let currentMode = 'reference'; // 'reference' or 'store'
    let activeTabIndex = 1; // 1 is Search (matching reference screenshot)
    let currentBasePageTab = 0; // 0 is Home

    const referenceTabs = [
      {
        id: 'home',
        label: 'Home',
        icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>`,
        badge: null,
        isBasePage: true
      },
      {
        id: 'search',
        label: 'Search',
        icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7.5"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg>`,
        badge: null
      },
      {
        id: 'create',
        label: 'Create',
        icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>`,
        badge: null
      },
      {
        id: 'inbox',
        label: 'Inbox',
        icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>`,
        badge: 'dot'
      },
      {
        id: 'saved',
        label: 'Saved',
        icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>`,
        badge: null
      }
    ];

    const storeTabs = [
      {
        id: 'home',
        label: 'Home',
        icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>`,
        badge: null,
        isBasePage: true
      },
      {
        id: 'search',
        label: 'Search',
        icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7.5"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg>`,
        badge: null
      },
      {
        id: 'shop',
        label: 'Shop',
        icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg>`,
        badge: null
      },
      {
        id: 'cart',
        label: 'Cart',
        icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-2z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>`,
        badge: 'counter'
      },
      {
        id: 'account',
        label: 'Account',
        icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>`,
        badge: null
      }
    ];

    function renderNavItems() {
      const tabs = currentMode === 'reference' ? referenceTabs : storeTabs;
      const container = document.getElementById('nav-items-container');
      container.innerHTML = '';

      tabs.forEach((tab, index) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.setAttribute('data-nav-index', index);
        btn.className = 'mobile-nav-item';
        if (index === activeTabIndex) btn.classList.add('active');
        if (tab.isBasePage) btn.classList.add('is-current-page');

        let badgeHtml = '';
        if (tab.badge === 'dot') {
          badgeHtml = `<span class="nav-badge-dot"></span>`;
        } else if (tab.badge === 'counter') {
          badgeHtml = `<span class="nav-badge-counter">2</span>`;
        }

        btn.innerHTML = `
          <div class="nav-icon-wrap relative">
            ${tab.icon}
            ${badgeHtml}
          </div>
          <span class="mobile-nav-label">${tab.label}</span>
        `;

        // Click handler
        btn.addEventListener('click', () => {
          setActiveTab(index);
        });

        // Hover effect for fluid live wave gliding
        btn.addEventListener('mouseenter', () => {
          previewTab(index);
        });

        container.appendChild(btn);
      });

      // Mouse leaves bar: return to current active tab
      const nav = document.getElementById('mobile-bottom-nav');
      nav.onmouseleave = () => {
        previewTab(activeTabIndex);
      };
    }

    function previewTab(index) {
      const nav = document.getElementById('mobile-bottom-nav');
      nav.style.setProperty('--active-tab', index);
      const items = nav.querySelectorAll('.mobile-nav-item');
      items.forEach((item, i) => {
        if (i === index) item.classList.add('active');
        else item.classList.remove('active');
      });
    }

    function setActiveTab(index) {
      activeTabIndex = index;
      previewTab(index);

      const searchCapsule = document.getElementById('mobile-floating-search-bar');
      const searchInput = document.getElementById('quick-search-input');

      if (index === 1) { // Search tab
        searchCapsule.classList.remove('is-hidden');
        if (searchInput) {
          setTimeout(() => searchInput.focus(), 100);
        }
      } else {
        searchCapsule.classList.add('is-hidden');
        if (searchInput) searchInput.blur();
      }
    }

    function closeSearch() {
      const searchCapsule = document.getElementById('mobile-floating-search-bar');
      searchCapsule.classList.add('is-hidden');
      setActiveTab(0); // Return to Home
    }

    function toggleTheme() {
      const body = document.body;
      if (body.classList.contains('theme-light')) {
        body.classList.remove('theme-light');
        body.classList.add('theme-dark');
      } else {
        body.classList.remove('theme-dark');
        body.classList.add('theme-light');
      }
    }

    function toggleTabSet() {
      currentMode = currentMode === 'reference' ? 'store' : 'reference';
      const btn = document.getElementById('toggle-tabset-btn');
      btn.textContent = currentMode === 'reference' ? 'Mode: Reference (Image)' : 'Mode: Store App';
      renderNavItems();
      previewTab(activeTabIndex);
    }

    // Initialize on page load
    renderNavItems();
    setActiveTab(1); // Default to Search active to match reference image
  </script>
</body>
</html>
